      cameraReview.samples.push({ index: i, offset: cameraOffset, position: game.camera.position.toArray(),
        tier: game.settings.graphics, view: select("view").value, theme: game.world.theme.id,
        renderedFrames, errorCount, directFallback: game.renderPipeline.direct });
    }

};
async function runDecoyReview(crossTier = false, overlap = false) {
  if (resetReview.running || cacheReview.running || cameraReview.running || decoyReview.running) return;
  decoyReview.running = true; decoyReview.samples = []; decoyReview.error = null;
  decoyPipelines = [];
  try {
    if (overlap) select("tier").value = "high";
    await reset();
    const serial = sceneSerial, hero = game.players[0];
    const weapon = Object.values(WEAPONS).find(weapon => weapon.decoyDuration);
    const sample = async (cycle, phase) => {
      const readyFrame = renderedFrames + 30;
      await waitForReviewFrame(serial, () => renderedFrames >= readyFrame);
      decoyReview.samples.push({ cycle, phase, tier: game.settings.graphics, active: game.decoys.length, retained: Boolean(game.decoyRenderAnchor),
        anchorContext: game.decoyRenderAnchor?.userData.decoyRenderContext,
        pipelineCreations, ...game.renderer.info.memory, errorCount, directFallback: game.renderPipeline.direct });
    };
    if (overlap) {
      await sample(-1, "baseline");
      game.spawnDecoy(hero.position.clone().add(new THREE.Vector3(1.5, 0, 0)), hero, weapon);
      const old = game.decoys.at(-1);
      await sample(0, "old-high-visible");
      old.mesh.visible = false;
      select("tier").value = "medium"; game.settings.graphics = "medium"; game.applyGraphicsSettings();
      game.spawnDecoy(hero.position.clone().add(new THREE.Vector3(1.5, 0, 0)), hero, weapon);
      const current = game.decoys.at(-1);
      await sample(1, "new-medium-visible");
      game.removeDecoy(current);
      await sample(1, "medium-anchor");
      game.removeDecoy(old);
      await sample(0, "old-high-expired");
      if (game.decoyRenderAnchor !== current.mesh) throw new Error("Old tier replaced the current anchor");
      for (let cycle = 2; cycle < 4; cycle++) {
        game.spawnDecoy(hero.position.clone().add(new THREE.Vector3(1.5, 0, 0)), hero, weapon);
        await sample(cycle, "spawned");
        game.removeDecoy(game.decoys[0]);
        await sample(cycle, "removed");
      }
    } else for (const tier of crossTier ? ["high", "medium", "low", "medium", "high"] : [game.settings.graphics]) {
      select("tier").value = tier; game.settings.graphics = tier; game.applyGraphicsSettings();
      await sample(-1, "baseline");
      for (let cycle = 0; cycle < 3; cycle++) {
        game.spawnDecoy(hero.position.clone().add(new THREE.Vector3(1.5, 0, 0)), hero, weapon);
        await sample(cycle, "spawned");
        game.removeDecoy(game.decoys[0]);
        await sample(cycle, "removed");
      }
    }
    game.clearTransientNetworkCombat();
    await sample(3, "cleanup");
  } catch (error) { decoyReview.error = String(error); }
  finally { decoyReview.running = false; }
}

select("decoy-overlap").onclick = () => runDecoyReview(false, true);

select("destroy").onclick = () => game.world.queueStructuralFailure(game.world.structures[16].segments[0], game.players[0].id);
select("grapple").onclick = () => {

select("inspect-surface").onclick = () => {
  const ray = new THREE.Raycaster(game.players[0].position.clone().add(new THREE.Vector3(0, .4, 0)), new THREE.Vector3(0, -1, 0));

select("stress").onclick = () => {

};
const frame = game.frame.bind(game);

    aoNormals: depthAONormals ? "depth" : geometryAONormals ? "geometry" : legacyAONormals ? "legacy-material" : "depth-matched-material", aoOutput, hiddenAOObject,
    aoNormalBlending: game.renderPipeline.scenePass?.getMRT()?.getBlendMode("normal").blending ?? null,
    materialBlendAONormals,

    aoRecoveryApplied: Boolean(game.renderPipeline.aoPass && game.renderPipeline.aoPass.normalNode !== null &&
