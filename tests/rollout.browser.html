<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphics rollout integration</title><link rel="stylesheet" href="/src/styles.css">
<div id="app"><canvas id="game-canvas"></canvas><div id="ui-root"></div></div>
<div id="match-loading" hidden><span data-match-seed></span><span data-match-kind></span></div>
<aside style="position:fixed;z-index:999;bottom:0;left:0;background:#09131de8;color:white;padding:8px;font:12px monospace;max-width:95vw">
<label>Tier <select id="tier"><option>high</option><option>medium</option><option>low</option></select></label>
<label><input id="reduced" type="checkbox">Reduced motion</label>
<button id="burst">Explosion</button><button id="run">Run simulation</button>
<button id="reset">Reset scene</button><button id="stress">16 fighters</button><button id="ten">Ten resets</button>
<pre id="metrics" style="white-space:pre-wrap;max-height:130px;overflow:auto">Importing engine…</pre></aside>
<script type="module">
import * as THREE from 'three/webgpu';
import { NeonRenderPipeline } from '../src/renderPipeline.js';
const initialTier=new URLSearchParams(location.search).get('tier');
const setQuality=NeonRenderPipeline.prototype.setQuality;
if(['high','medium','low'].includes(initialTier)) {
  document.querySelector('#tier').value=initialTier;
  NeonRenderPipeline.prototype.setQuality=function(){return setQuality.call(this,initialTier);};
}
const metrics=document.querySelector('#metrics'),errors=[],resets=[];
let phase='Importing engine',frames=0,windowStart=0,windowFrames=0,fps=0,cpuMs=0;
const report=e=>{const message=String(e?.message??e);if(!errors.includes(message))errors.push(message);metrics.textContent=JSON.stringify({phase,frames,errors},null,2);};
addEventListener('error',report);addEventListener('unhandledrejection',e=>report(e.reason));
const originalError=console.error;console.error=(...args)=>{report(args.join(' '));originalError(...args);};
const init=THREE.WebGPURenderer.prototype.init;
THREE.WebGPURenderer.prototype.init=async function(...args){metrics.textContent=phase='Initializing GPU';const result=await init.apply(this,args);metrics.textContent=phase='GPU ready';return result;};
const prefilter=THREE.PMREMGenerator.prototype.fromScene;
THREE.PMREMGenerator.prototype.fromScene=function(...args){metrics.textContent=phase='Prefiltering environment';const result=prefilter.apply(this,args);metrics.textContent=phase='Environment ready';return result;};
performance.mark('blaster-shell-visible');
const {gameReady}=await import('../src/main.js');
const game=await gameReady;
NeonRenderPipeline.prototype.setQuality=setQuality;
game.renderer.onError=report;
const originalFrame=game.frame.bind(game);
game.frame=time=>{const start=performance.now();originalFrame(time);cpuMs=performance.now()-start;frames++;windowFrames++;
  if(!windowStart)windowStart=time;
  if(time-windowStart>1000){fps=windowFrames*1000/(time-windowStart);windowFrames=0;windowStart=time;}
  if(frames%30===0)metrics.textContent=JSON.stringify({phase,frames,fps:Math.round(fps),cpuMs:Math.round(cpuMs*10)/10,
    profile:game.renderPipeline.profile,direct:game.renderPipeline.direct,players:game.players.length,
    textures:game.renderer.info.memory.textures,geometries:game.renderer.info.memory.geometries,
    blur:game.renderPipeline.motionBlur?.amount.value,errors,resets},null,2);
};
async function reset(count=2){metrics.textContent=phase='Building match';game.mode='training';game.seed='BLAST-01';
  game.settings.botCount=count-1;game.settings.matchSettings.training.botsStandStill=count<16;
  game.settings.matchSettings.training.botsDontAttack=count<16;game.timeLimitMinutes=30;game.targetScore=10000;
  game.settings.graphics=document.querySelector('#tier').value;game.applyGraphicsSettings();game.freshSessionReady=true;
  await game.startMatch();game.paused=true;game.awaitingAudioGesture=false;game.matchStartDelay=0;phase='Rendering match';
}
document.querySelector('#tier').onchange=e=>{game.settings.graphics=e.target.value;game.applyGraphicsSettings();};
document.querySelector('#reduced').onchange=e=>{game.settings.reducedMotion=e.target.checked;game.renderPipeline.setReducedMotion(e.target.checked);};
document.querySelector('#burst').onclick=()=>game.combatVisuals.explosions.spawn(game.players[0].position.clone().add(new THREE.Vector3(1,.5,1)),3);
document.querySelector('#run').onclick=()=>{game.paused=!game.paused;phase=game.paused?'Paused scene':'Running simulation';};
document.querySelector('#reset').onclick=()=>reset();document.querySelector('#stress').onclick=()=>reset(16);
document.querySelector('#ten').onclick=async()=>{resets.length=0;for(let i=0;i<10;i++){await reset();
  for(let frame=0;frame<4;frame++)await new Promise(requestAnimationFrame);
  resets.push({cycle:i+1,textures:game.renderer.info.memory.textures,geometries:game.renderer.info.memory.geometries});}phase='Ten resets complete';};
await reset();
</script>
