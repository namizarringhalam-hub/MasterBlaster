<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Blaster — Mecha review</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#0a1220;color:#d9e5f2;font:13px system-ui}canvas{display:block;width:100%}
  header{padding:14px 20px 10px;background:#0e1a2a}h1{font-size:17px;margin:0 0 10px;letter-spacing:2px}label{margin-right:12px;display:inline-block;margin-bottom:8px}
  select,button{color:#edf8ff;background:#182d43;border:1px solid #3c5874;padding:5px;border-radius:4px}#status{font:11px monospace;color:#91b5d3;margin-top:0}
  #comparison{display:flex;height:calc(100vh - 145px)}#render{flex:1;min-width:0;position:relative}#reference{width:32%;max-width:300px;margin:0;background:#03080e;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid #294257;padding:12px}#reference img{width:100%;height:calc(100% - 32px);object-fit:contain}figcaption{color:#94b7d0;font-size:11px;padding:8px;letter-spacing:1px}#render::before{content:'LIVE MODEL';position:absolute;top:12px;left:16px;color:#94b7d0;font-size:11px;letter-spacing:1px}
  #reference-detail{display:none;width:100%;aspect-ratio:210/147;background:url('./assets/mecha-concept.png') 4.925% 10.453% / 796.19% auto no-repeat}#reference.detail{width:40%;max-width:430px}#reference.detail img{display:none}#reference.detail #reference-detail{display:block}
</style>
<header><h1>MASTER BLASTER / MECHA REVIEW</h1>
<label>View <select id="view"><option value="single">Single fighter</option><option value="head">Helmet &amp; boosters</option><option value="lineup">Six colors</option><option value="back">Rear</option><option value="side">Side</option></select></label>
<label>Color <select id="color"><option>Cyan</option><option>Crimson</option><option>Lime</option><option>Violet</option><option>Amber</option><option>Magenta</option></select></label>
<label>Armor <select id="variant"><option value="0">Vanguard</option><option value="1">Striker</option><option value="2">Bulwark</option><option value="3">Lancer</option></select></label>
<label>Pose <select id="pose"><option value="ready">Ready</option><option value="aim">Aim</option><option value="run">Run</option><option value="motion">Run / reverse / strafe / stop</option><option value="jump">Jump</option><option value="grapple">Grapple</option><option value="fire">Fire</option><option value="reload">Reload</option><option value="hit">Hit</option></select></label>
<label>Weapon <select id="weapon"></select></label><button id="pause">Pause</button> <button id="step">Step 6 frames</button><div id="status">Loading renderer…</div></header>
<main id="comparison"><div id="render"></div><figure id="reference"><img src="./assets/mecha-cyan-reference.png" alt="Approved cyan mecha concept"><div id="reference-detail" role="img" aria-label="Helmet and booster detail from the original concept"></div><figcaption>TARGET CONCEPT</figcaption></figure></main>
<script type="module">
import * as THREE from "three/webgpu";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Fighter } from "../src/player.js";
import { WEAPONS } from "../src/gameData.js";
const select = id => document.getElementById(id), scene = new THREE.Scene();
const renderer = new THREE.WebGPURenderer({antialias:true});
await renderer.init(); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true;
document.getElementById("render").append(renderer.domElement);
scene.background = new THREE.Color(0x0a1422);
const pmrem = new THREE.PMREMGenerator(renderer), room = new RoomEnvironment();
const environment = pmrem.fromScene(room);
scene.environment = environment.texture; scene.environmentIntensity = .35;
room.dispose(); pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xcde9ff, 0x344a61, .3));
for (const [color, intensity, x, y, z] of [[0xf1f7ff,3,-3,6,5],[0x77d5ff,2.5,4,3,-4],[0xffd1a6,.35,3,3,5]]) {
  const light = new THREE.DirectionalLight(color,intensity);light.position.set(x,y,z);scene.add(light);
  if(x===-3){light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-7;light.shadow.camera.right=7;light.shadow.camera.top=5;light.shadow.camera.bottom=-4;light.shadow.bias=-.0002;light.shadow.normalBias=.015;}
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x142438,roughness:.8,metalness:.2}));
floor.rotation.x = -Math.PI/2; floor.position.y = -.015; scene.add(floor);
floor.receiveShadow=true;
scene.add(new THREE.GridHelper(40,40,0x315e7a,0x1d3547));
const camera = new THREE.PerspectiveCamera(34,1,.05,100);
const colors = [[0x129dba,0x6ff6ff],[0xc82849,0xff6b82],[0x6bad22,0xb9ff55],[0x7847ca,0xc793ff],[0xd77a16,0xffc14f],[0xb92d86,0xff75cf]];
for (const weapon of Object.values(WEAPONS)) select("weapon").add(new Option(weapon.name,weapon.id));
let fighters = [], paused = false, steps = 0, elapsed = 0, previous = performance.now(), errors = 0;
window.addEventListener("error",()=>errors++); window.addEventListener("unhandledrejection",()=>errors++);
const world = { resolve(position) { const grounded = position.y <= 0; if(grounded) position.y=0; return {grounded}; }, boostAt:()=>null };
const still = new THREE.Vector3(), aim = new THREE.Vector3(0,0,1), move = new THREE.Vector3(0,0,1);
function rebuild() {
  for(const fighter of fighters) fighter.dispose(); fighters=[];
  const lineup = select("view").value === "lineup", count = lineup ? 6 : 1;
  for(let i=0;i<count;i++) {
    const [color,accent] = colors[lineup?i:select("color").selectedIndex];
    const variant = lineup ? i%4 : Number(select("variant").value);
    // The suffix maps exactly to the production id hash's four armor variants.
    let id = `review-${i}-`; while([...id].reduce((n,c)=>n+c.charCodeAt(0),0)%4!==variant) id+='a';
    const f = new Fighter(scene,{id,color,accent},[select("weapon").value],new THREE.Vector3());
    f.identityBeacon.visible=false; f.identityRing.visible=false; f.freezeRing.visible=false;
    f.rig.traverse(o=>{if(o.isMesh&&!o.material.transparent){o.castShadow=true;o.receiveShadow=true;}});
    for(let step=0;step<60;step++) f.update(1/60,still,aim,{},world);
    fighters.push(f);
  }
  select("reference").classList.toggle("detail",select("view").value==="head");
  resize();
}
function frameCamera() {
  const view=select("view").value;
  camera.position.set(...(view==="head"?[.55,2.22,1.4]:view==="lineup"?[.8,3.1,11]:view==="back"?[-2.5,2.4,-4.8]:view==="side"?[5.1,2.1,.2]:[1.65,1.7,5.7]));
  if(view==="lineup")camera.position.multiplyScalar(Math.max(1,1.9/camera.aspect));
  camera.lookAt(0,view==="head"?2.16:view==="lineup"?1.15:1.27,0);
}
for(const id of ["view","color","variant","weapon"]) select(id).onchange=rebuild;
select("pause").onclick=()=>{paused=!paused;select("pause").textContent=paused?"Resume":"Pause";};
select("step").onclick=()=>{paused=true;steps=6;select("pause").textContent="Resume";};
function resize(){const height=innerHeight-document.querySelector("header").offsetHeight;document.getElementById("comparison").style.height=`${height}px`;const width=document.getElementById("render").clientWidth;renderer.setSize(width,height);camera.aspect=width/height;camera.updateProjectionMatrix();frameCamera();}
addEventListener("resize",resize);resize();rebuild();
renderer.setAnimationLoop(()=>{
  const now=performance.now(),dt=steps?1/60:Math.min((now-previous)/1000,.035);previous=now;
  if(!paused||steps>0) {
    if(steps>0)steps--;
    elapsed+=dt;
    fighters.forEach((f,i)=>{
      const pose=select("pose").value;
      f.position.set(0,pose==="jump"?.65:pose==="grapple"?.7:0,0);
      f.grapple=pose==="grapple"?{anchor:new THREE.Vector3(-5,9,8),wraps:[],ropeLength:12}:null;
      f.grounded=pose!=="jump"&&pose!=="grapple";
      if(pose==="jump") f.velocity.set(0,3,5);
      if(pose==="fire") f.recoilVisual=.12+.1*Math.sin(elapsed*16);
      f.reloadTimer=pose==="reload"?.8:0;
      if(pose==="hit") f.hitTimer=.3;
      const cycle=Math.floor(elapsed%8/2);
      move.set(...(pose==="motion"?(cycle===0?[0,0,1]:cycle===1?[0,0,-1]:cycle===2?[1,0,0]:[0,0,0]):[0,0,1]));
      f.update(dt,pose==="run"||pose==="motion"?move:still,aim,{},world);
      f.position.x=select("view").value==="lineup"?(i-2.5)*1.8:0;f.position.z=0;
      if(pose==="ready") { f.weaponGroup.visible=false; f.leftArm.rotation.set(.05,0,.10);f.rightArm.rotation.set(.05,0,-.10);f.leftForearm.rotation.set(-.1,0,0);f.rightForearm.rotation.set(-.1,0,0); }
      else f.weaponGroup.visible=true;
    });
  }
  renderer.render(scene,camera);
  select("status").textContent=`${renderer.backend.isWebGPUBackend?'WebGPU':'WebGL'} · ${fighters.length} fighters · ${renderer.info.render.drawCalls} draws · ${renderer.info.render.triangles} triangles · ${errors} errors · ${select("pose").value}`;
});
</script>
</html>
