<!doctype html><meta charset="utf-8"><title>Particle lighting and depth review</title>
<style>body{margin:0;background:#09131d;color:white;font:14px system-ui}nav{padding:12px;display:flex;gap:16px}canvas{display:block}pre{white-space:pre-wrap}</style>
<nav><label>Tier <select id="tier"><option>high</option><option>medium</option><option>low</option></select></label>
<label>Age <select id="age"><option value=".18">Fire</option><option value=".5" selected>Smoke</option><option value="1">Late smoke</option></select></label>
<label><input id="soft" type="checkbox" checked>Soft particles</label><label><input id="light" type="checkbox" checked>Warm light</label>
<label><input id="heat" type="checkbox" checked>Heat shimmer</label><label><input id="reduced" type="checkbox">Reduced motion</label>
<button id="reset">Reset explosion</button><button id="clear">Clear particles</button></nav>
<button id="impact">Impact wall</button><button id="move-wall">Move marked wall</button><button id="remove-wall">Remove marked wall</button>
<button id="run-mecha">Run mecha</button><button id="brake-mecha">Brake mecha</button>
<button id="fire-mecha">Fire mecha weapon</button><button id="reload-mecha">Reload mecha weapon</button><button id="swap-mecha">Swap mecha weapon</button>
<button id="hold-reload">Hold reload midpoint</button>
<canvas id="canvas"></canvas><pre id="metrics">Initializing…</pre>
<script type="module">
import * as THREE from 'three/webgpu';
import { CombatVisuals } from '../src/combatVisuals.js';
import { NeonRenderPipeline } from '../src/renderPipeline.js';
import { WEAPONS } from '../src/gameData.js';
import { Fighter } from '../src/player.js';
const metrics = document.querySelector('#metrics'), errors = [];
addEventListener('error', e => errors.push(e.message));
addEventListener('unhandledrejection', e => errors.push(String(e.reason)));
const renderer = new THREE.WebGPURenderer({canvas:document.querySelector('#canvas'),antialias:true,
  forceWebGL:new URLSearchParams(location.search).get('renderer') === 'webgl'});
await renderer.init(); renderer.setSize(960,540); renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.VSMShadowMap;
const scene = new THREE.Scene(); scene.background=new THREE.Color(0x09131d);
const camera = new THREE.PerspectiveCamera(45,960/540,.1,100);
camera.position.set(6,3.3,7); camera.lookAt(0,.5,0);
scene.add(new THREE.HemisphereLight(0x6688bb,0x18202a,1.4));
const key = new THREE.DirectionalLight(0xbbddff,2); key.position.set(-4,8,3); key.castShadow=true;
key.shadow.mapSize.set(1024,1024); key.shadow.camera.left=-12; key.shadow.camera.right=12;
key.shadow.camera.top=12; key.shadow.camera.bottom=-12; scene.add(key);
const warm = new THREE.PointLight(0xff6611,35,8,2); warm.position.set(-1,1,1); scene.add(warm);
let wall;
for (const [size,position,color] of [[[20,.2,20],[0,-.1,0],0x536473],[[4,3,.4],[0,1.5,-1],0x344758]]) {
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),new THREE.MeshStandardNodeMaterial({color,roughness:.7}));
  mesh.position.set(...position); mesh.castShadow=mesh.receiveShadow=true; scene.add(mesh);
  if(size[0]===4)wall={x:0,z:-1,w:4,d:.4,baseY:0,top:3,mesh};
}
const effects = new CombatVisuals(scene), pipeline = new NeonRenderPipeline(renderer,scene,camera);
const fighter = new Fighter(scene,{id:'inertia-review',color:0x129dba,accent:0x6ff6ff},['blaster','minigun'],new THREE.Vector3());
fighter.group.visible=false;
const move = new THREE.Vector3(), look = new THREE.Vector3(0,0,1), cameraOffset = new THREE.Vector3(4,2.6,5);
const world = {resolve(position){const grounded=position.y<=0;if(grounded)position.y=0;return{grounded};},boostAt:()=>null};
let holdPose=false;
document.querySelector('#run-mecha').onclick=()=>{effects.update(10);fighter.group.visible=true;move.set(0,0,1);};
document.querySelector('#brake-mecha').onclick=()=>move.set(0,0,0);
document.querySelector('#fire-mecha').onclick=()=>{fighter.group.visible=true;fighter.recoil(4);fighter.attackTimer=.2;};
document.querySelector('#reload-mecha').onclick=()=>{fighter.group.visible=true;fighter.ammo[fighter.weapon.id]=0;fighter.reload();};
document.querySelector('#swap-mecha').onclick=()=>{fighter.switchSlot(1-fighter.slotIndex);};
document.querySelector('#hold-reload').onclick=()=>{fighter.group.visible=true;fighter.ammo[fighter.weapon.id]=0;fighter.reload();fighter.reloadTimer=fighter.weapon.reload*.5;
  for(let i=0;i<12;i++){fighter.reloadTimer=fighter.weapon.reload*.5;fighter.update(1/120,new THREE.Vector3(),look,{},world);}holdPose=true;};
function reset() { effects.update(10); effects.explosions.spawn(new THREE.Vector3(0,.25,0),3);
  const age=Number(document.querySelector('#age').value);
  for(let t=0;t<age;t+=1/120)effects.update(Math.min(1/120,age-t)); }
document.querySelector('#reset').onclick=reset; document.querySelector('#age').onchange=reset;
document.querySelector('#clear').onclick=()=>effects.update(10);
document.querySelector('#impact').onclick=()=>{effects.update(10);effects.impact(new THREE.Vector3(wall.x,1,-.8),WEAPONS.blaster,null,
  {size:1.8,normal:new THREE.Vector3(0,0,1),surface:wall});effects.update(.4);};
document.querySelector('#move-wall').onclick=()=>{wall.x+=.5;wall.mesh.position.x=wall.x;effects.update(.01);};
document.querySelector('#remove-wall').onclick=()=>{wall.removed=true;scene.remove(wall.mesh);effects.update(.01);};
document.querySelector('#tier').onchange=e=>pipeline.setQuality(e.target.value);
document.querySelector('#soft').onchange=e=>{if(pipeline.particleDepth)pipeline.particleDepth.strength.value=e.target.checked?1:0;};
document.querySelector('#light').onchange=e=>{warm.intensity=e.target.checked?35:0;};
document.querySelector('#heat').onchange=e=>{if(pipeline.heatDistortion)pipeline.heatDistortion.strength.value=e.target.checked?1:0;};
document.querySelector('#reduced').onchange=e=>pipeline.setReducedMotion(e.target.checked);
reset(); let frames=0;
renderer.setAnimationLoop(()=>{
  if(fighter.group.visible){if(!holdPose)fighter.update(1/60,move,look,{reducedMotion:document.querySelector('#reduced').checked},world);
    camera.position.copy(fighter.position).add(cameraOffset);camera.lookAt(fighter.position.x,1.2,fighter.position.z);}
  pipeline.render();frames++;
  if(frames%30===0)metrics.textContent=JSON.stringify({frames,quality:pipeline.quality,profile:pipeline.profile,direct:pipeline.direct,
    depthFrames:pipeline.particleDepth?.frames,depthSize:pipeline.particleDepth?[pipeline.particleDepth.target.width,pipeline.particleDepth.target.height]:null,
    heatSources:pipeline.heatDistortion?.parameters.filter(p=>p.w>0).length,
    inertia:fighter.group.visible?{pitch:fighter.bodyPitchSpring.value,roll:fighter.bodyRollSpring.value}:null,
    weapon:fighter.group.visible?{id:fighter.weapon.id,kick:fighter.weaponKick.value,spin:fighter.weaponSpinSpeed,magazineY:fighter.weaponMagazine?.position.y}:null,
    textures:renderer.info.memory.textures,errors},null,2);
});
</script>
