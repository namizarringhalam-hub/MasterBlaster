<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <meta name="description" content="Blaster Battle — fast browser-native 3D arena combat with physical projectiles, bots, seeded maps, and grappling." />
    <meta property="og:title" content="Blaster Battle" />
    <meta property="og:description" content="Swing fast. Blast smart. Browser-native 3D arena combat." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Blaster Battle</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <div id="match-loading" class="rematch-loading" role="status" aria-live="polite" aria-atomic="true" hidden>
      <div class="rematch-loading-grid" aria-hidden="true"></div>
      <section class="rematch-loading-card">
        <p class="kicker">ARENA INITIALIZATION</p>
        <div class="rematch-loading-core" aria-hidden="true"><i></i><i></i><span></span></div>
        <h1>Loading a fresh battlefield</h1>
        <p>Closing any previous graphics session and starting a clean arena.</p>
        <div class="rematch-loading-track" aria-hidden="true"><i></i></div>
        <small><b data-match-seed>BLAST-01</b><span data-match-kind>NEW SESSION</span><span>FRESH RENDERER</span></small>
      </section>
    </div>
    <script>
      try {
        const pending = sessionStorage.getItem("blaster-pending-match");
        if (pending) {
          const saved = JSON.parse(pending);
          const queuedAt = Number(saved?.queuedAt);
          const age = Date.now() - queuedAt;
          if (saved?.seed && Number.isFinite(queuedAt) && age >= 0 && age <= 30000) {
            const loading = document.querySelector("#match-loading");
            loading.hidden = false;
            loading.querySelector("[data-match-seed]").textContent = String(saved.seed).slice(0, 12);
            loading.querySelector("[data-match-kind]").textContent = saved.sameSeed ? "SAME SEED" : "NEW SESSION";
          } else sessionStorage.removeItem("blaster-pending-match");
        }
      } catch { sessionStorage.removeItem("blaster-pending-match"); }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
